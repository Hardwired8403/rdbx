[workspace]
resolver = "2"
members = [
    "crates/rdbx-core",
    "crates/rdbx-storage",
    "crates/rdbx-buffer",
    "crates/rdbx-wal",
    "crates/rdbx-btree",
    "crates/rdbx-mvcc",
    "crates/rdbx-query",
    "crates/rdbx-sql",
    "crates/rdbx",
    "crates/rdbx-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Hardwired8403/rdbx"
authors = ["Hardwired8403"]

[workspace.dependencies]
rdbx-core    = { path = "crates/rdbx-core" }
rdbx-storage = { path = "crates/rdbx-storage" }
rdbx-buffer  = { path = "crates/rdbx-buffer" }
rdbx-wal     = { path = "crates/rdbx-wal" }
rdbx-btree   = { path = "crates/rdbx-btree" }
rdbx-mvcc    = { path = "crates/rdbx-mvcc" }
rdbx-query   = { path = "crates/rdbx-query" }
rdbx-sql     = { path = "crates/rdbx-sql" }
thiserror    = "2.0.21"
crc32fast    = "1.5.4"
uuid         = { version = "1.29.0", features = ["v4"] }
proptest     = "1.12.0"
criterion    = "0.8.2"


[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1